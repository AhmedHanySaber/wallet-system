services:
  postgres:
    image: postgres:17-alpine
    container_name: wallet_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wallet_db}
    ports:
      - '${DB_PORT:-5050}:5050'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
